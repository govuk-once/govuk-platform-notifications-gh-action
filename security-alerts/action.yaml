name: Send Security Alert Notification
description: Send a security alert notification to Slack via the govuk-once notifications hub

inputs:
  title:
    description: Short title of the notification (e.g. "New ZAP security findings")
    required: true
  message:
    description: Body text — supports markdown, line breaks, bullet lists, and links
    required: true
  finding_count:
    description: Number of security findings
    required: true
  findings:
    description: Security findings content
    required: true
  repository:
    description: Repository name (e.g. "govuk-once/my-service")
    required: true
  workflow_url:
    description: URL of the GitHub Actions workflow run
    required: true
  slack_channel:
    description: "Target Slack channel, e.g. #my-channel"
    required: true
  aws_account_id:
    description: AWS account ID where the notifications-spoke queue is deployed
    required: true
  aws_region:
    description: AWS region of the spoke SQS queue
    required: true

runs:
  using: composite
  steps:
    - name: Build notification payload
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
        TITLE: ${{ inputs.title }}
        FINDING_COUNT: ${{ inputs.finding_count }}
        FINDINGS: ${{ inputs.findings }}
        REPOSITORY: ${{ inputs.repository }}
        WORKFLOW_URL: ${{ inputs.workflow_url }}
        SLACK_CHANNEL: ${{ inputs.slack_channel }}
      run: |
        jq -n \
          --arg message       "$MESSAGE" \
          --arg message_type  "security_alerts" \
          --arg title         "$TITLE" \
          --arg finding_count "$FINDING_COUNT" \
          --arg findings      "$FINDINGS" \
          --arg repository    "$REPOSITORY" \
          --arg workflow_url  "$WORKFLOW_URL" \
          --arg slack_channel "$SLACK_CHANNEL" \
          '{message: $message, message_type: $message_type, title: $title,
            finding_count: $finding_count, findings: $findings, repository: $repository,
            workflow_url: $workflow_url, slack_channel: $slack_channel}' \
          > "$RUNNER_TEMP/notification.json"

    - name: Send notification
      shell: bash
      env:
        ACCOUNT_ID: ${{ inputs.aws_account_id }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: |
        aws sqs send-message \
          --queue-url "https://sqs.${AWS_REGION}.amazonaws.com/${ACCOUNT_ID}/notifications-spoke" \
          --message-body "file://$RUNNER_TEMP/notification.json" \
          --region "$AWS_REGION"
